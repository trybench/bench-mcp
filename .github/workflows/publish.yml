name: Publish

# Publishes to npm on a version tag. Uses npm trusted publishing (OIDC),
# so no npm token is stored in this repository — the registry verifies
# the workflow identity directly.
#
# The first publish of a package cannot use this: trusted publishing is
# configured per package on npmjs.com, and the package has to exist
# first. Publish once locally with `npm publish --access public`, then
# add this workflow as a trusted publisher.

on:
  push:
    tags: ['v*']
  # Re-run for an existing tag without re-pushing it.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true

permissions:
  id-token: write # required for OIDC
  contents: write # creates the GitHub release for the tag

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve the release tag
        run: echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 ships with.
          node-version: '24'
          # registry-url is required: npm only attempts the trusted-publishing
          # OIDC exchange for a registry it has auth configuration for.
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm new enough for trusted publishing
        run: npm install -g npm@^11 && npm --version

      - run: npm ci

      # The package ships compiled output, so a broken build must fail
      # here rather than being published.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the tag matches package.json
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm publish --access public --provenance

      - name: Create the GitHub release and mark it latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --latest --draft=false
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --latest
          fi
